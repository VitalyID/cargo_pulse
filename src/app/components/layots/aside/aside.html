@for (section of navigationItems; track $index) {
  <app-navigation
    (click)="!viewPort().TABLET"
    [icon]="section.icon"
    [title]="section.title"
    [closeIcon]="$index === 0"
    [isOpenMenu]="section.isOpenMenu || false"
    (closeMenu)="closeMenu()"
    (userOpenMenu)="userOpenMenu()"
  >
  </app-navigation>
}
