<div class="navigation">
  <div class="navigation__icon" (click)="iconClick()">
    <app-svg-sprite [icon]="icon"></app-svg-sprite>
  </div>
  <div class="navigation__title" [class.open]="sideBarState$ | async" (click)="navigateToSection()">
    <span>{{ title || 'No title' }}</span>

    @if (closeIcon && viewPort()?.TABLET) {
      <app-svg-sprite icon="icon-x-circle" class="icon-close" (click)="menuOff()"></app-svg-sprite>
    }
  </div>
</div>
