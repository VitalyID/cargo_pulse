<div class="dialog">
  <h2 mat-dialog-title>{{data.title}}</h2>
  <div class="dialog__props">
    <ng-container
      *ngComponentOutlet="data.nameComponent;
      inputs : {userConf: userConf()}"
    ></ng-container>
  </div>

  <div class="dialog__button">
    <button
      matButton="outlined"
      mat-dialog-close="true"
      (click)="closeDialog()"
    >
      Закрыть
    </button>
  </div>
</div>
