<div class="dialog">
  <h2 mat-dialog-title>{{title}}</h2>
  <div class="dialog__props">
    <ng-container
      *ngComponentOutlet="nameComponent"
    ></ng-container>
  </div>

  <div class="dialog__button">
    <button
      matButton="outlined"
      mat-dialog-close
      (click)="closeDialog()"
    >
      Закрыть
    </button>
  </div>
</div>
